# The games this core builds, one [[game]] per MAME ROM set. tools/gen_games.py
# writes the files that list them from this one (CI checks they match), and the
# app's scripts/gen_games.py reads it once the app lists Chihiro games. The keys
# are in common/tools/games/afgames.py (CORE_KEYS, BOARDS, CONTROLS).

[[game]]
set = "vcop3"
title = "Virtua Cop 3"
year = 2003
board = "chihiro"
controls = "gun"
players = 2
gun_button = true
core_version = "1.1.0"
build = { xbe = "vc3.xbe" }

[[game]]
set = "hotd3"
title = "The House of the Dead III"
year = 2002
board = "chihiro"
controls = "gun"
players = 2
core_version = "1.1.0"
build = { xbe = "hod3xb.xbe" }

[[game]]
